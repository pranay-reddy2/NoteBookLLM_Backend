services:
  - type: web
    name: docmind-rag-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"